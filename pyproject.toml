[project]
name = "xlikes"
version = "0.1.0"
description = "Search your X (Twitter) likes locally"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
fetch = ["playwright>=1.40"]

[project.scripts]
xlikes = "xlikes.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
